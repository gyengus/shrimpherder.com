<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="The Saucy Shrimpherder – Premium freshwater & marine shrimp breeding, coral aquaculture, and official reefkeeper merch.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <title>The Saucy Shrimpherder</title>
    <style>
        :root {
            --bg-void: #000000;
            --neon-cyan: #5be7ff;
            --neon-cyan-glow: rgba(91, 231, 255, 0.45);
            --neon-orange: #ff7b36;
            --neon-orange-glow: rgba(255, 123, 54, 0.25);
            --text-cream: #fff8f0;
            --surface-pill: rgba(11, 28, 36, 0.78);
            --surface-pill-hover: rgba(16, 44, 56, 0.94);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-void);
            color: var(--text-cream);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(1rem, 2.5dvh, 1.75rem);
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100dvh;
            padding: 1.5rem;
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            flex-shrink: 1;
        }

        .logo {
            max-width: min(90vw, 760px);
            max-height: calc(100dvh - 11.5rem);
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .merch-cta {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            min-height: 3.125rem;
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            background-color: var(--surface-pill);
            border: 1.5px solid rgba(91, 231, 255, 0.65);
            color: var(--text-cream);
            font-size: 0.9375rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow:
                0 0 18px rgba(91, 231, 255, 0.22),
                inset 0 0 12px rgba(91, 231, 255, 0.12);
            transition:
                background-color 0.22s ease,
                border-color 0.22s ease,
                box-shadow 0.22s ease;
            opacity: 0;
            animation: fadeInSimple 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .merch-cta:hover {
            background-color: var(--surface-pill-hover);
            border-color: var(--neon-cyan);
            box-shadow:
                0 0 26px var(--neon-cyan-glow),
                0 0 44px var(--neon-orange-glow),
                inset 0 0 14px rgba(91, 231, 255, 0.24);
        }

        .merch-cta:active {
            background-color: rgba(11, 28, 36, 0.92);
            box-shadow:
                0 0 14px var(--neon-cyan-glow),
                inset 0 0 16px rgba(91, 231, 255, 0.28);
        }

        .merch-cta:focus-visible {
            outline: 2px solid var(--neon-orange);
            outline-offset: 4px;
        }

        .merch-cta__icon {
            width: 1.15rem;
            height: 1.15rem;
            stroke: var(--neon-cyan);
            flex-shrink: 0;
            filter: drop-shadow(0 0 6px var(--neon-cyan-glow));
            transition: transform 0.22s ease;
        }

        .merch-cta__arrow {
            width: 1rem;
            height: 1rem;
            stroke: var(--neon-orange);
            flex-shrink: 0;
            transition: transform 0.22s ease;
        }

        .merch-cta:hover .merch-cta__arrow {
            transform: translateX(3px);
        }

        .social-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            opacity: 0;
            animation: fadeInSimple 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 9999px;
            color: rgba(255, 248, 240, 0.55);
            text-decoration: none;
            transition:
                color 0.2s ease,
                filter 0.2s ease;
        }

        .social-link:hover {
            color: var(--neon-cyan);
            filter: drop-shadow(0 0 8px var(--neon-cyan-glow));
        }

        .social-link:active {
            color: var(--text-cream);
        }

        .social-link:focus-visible {
            outline: 2px solid var(--neon-orange);
            outline-offset: 2px;
            color: var(--text-cream);
        }

        .social-link svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.985);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeInSimple {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo,
            .merch-cta,
            .social-links {
                animation: none;
                opacity: 1;
                transform: none;
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <picture class="logo-wrapper">
            <source srcset="logo.webp" type="image/webp">
            <img src="logo.webp" alt="The Saucy Shrimpherder" class="logo" width="2048" height="2048" decoding="async">
        </picture>

        <a href="https://merch.shrimpherder.com/?utm_source=shrimpherder_com&utm_medium=referral&utm_campaign=launch_splash&utm_content=hero_merch_cta"
            class="merch-cta"
            aria-label="Visit The Saucy Shrimpherder Merch Shop">
            <svg class="merch-cta__icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
            <span>Merch</span>
            <svg class="merch-cta__arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
            </svg>
        </a>

        <nav class="social-links" aria-label="Social media">
            <a href="https://bsky.app/profile/shrimpherder.com"
                class="social-link"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="The Saucy Shrimpherder on Bluesky"
                title="Bluesky">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 10.8c-1.087-2.114-4.046-6.053-6.798-7.995C2.566.944 1.561 1.266.902 1.565.139 1.908 0 3.08 0 3.768c0 .69.378 5.65.624 6.479.815 2.736 3.713 3.66 6.383 3.364.136-.02.275-.039.415-.056-.138.022-.276.04-.415.056-3.912.58-7.387 2.005-2.83 7.078 5.013 5.19 6.87-1.113 7.823-4.308.953 3.195 2.05 9.271 7.733 4.308 4.267-4.308 1.172-6.498-2.74-7.078a8.741 8.741 0 0 1-.415-.056c.14.017.279.036.415.056 2.67.297 5.568-.628 6.383-3.364.246-.828.624-5.79.624-6.478 0-.69-.139-1.861-.902-2.206-.659-.298-1.664-.62-4.3 1.24C16.046 4.748 13.087 8.687 12 10.8Z" />
                </svg>
            </a>
            <a href="https://www.instagram.com/thesaucyshrimpherder"
                class="social-link"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="The Saucy Shrimpherder on Instagram"
                title="Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                    <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
                </svg>
            </a>
        </nav>
    </main>

</html>
